# Only the ticket receiver is exposed publicly - it is the only service that
# needs to accept webhooks. The RAG engine, agent and dispatcher are reachable
# only from inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-ingress
  namespace: support
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Webhook providers retry; a generous read timeout avoids duplicate tickets
    # caused by us timing out rather than them failing.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "200"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [support-api.acme.example]
      secretName: support-tls
  rules:
    - host: support-api.acme.example
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ticket-receiver
                port: {number: 8001}
---
# Default deny, then allow only the calls the architecture actually makes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: support
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-service-mesh
  namespace: support
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [rag-engine, agent, dispatcher, redis, ollama]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [ticket-receiver, agent, rag-engine, dispatcher]}
    # Prometheus needs to reach /metrics on every pod.
    - from:
        - namespaceSelector:
            matchLabels: {name: monitoring}
      ports:
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8002}
        - {protocol: TCP, port: 8003}
        - {protocol: TCP, port: 8004}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-receiver
  namespace: support
spec:
  podSelector:
    matchLabels: {app: ticket-receiver}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {name: monitoring}
      ports:
        - {protocol: TCP, port: 8001}
